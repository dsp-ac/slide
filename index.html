<!DOCTYPE html>

<head>

  <title>Course Lectures</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;

    header {
      background: #1f3c5b;

    .lecture {
      background: white;
      padding: 25px;

    }

    .lecture h2 {
      margin-top: 0;
      color: #1f3c5b;
    }

    .lecture p {
      color: #555;
    }

    .button {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 20px;
      background: #1f3c5b;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    .button:hover {
      background: #315d86;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
      font-size: 14px;
    }
  </style>
